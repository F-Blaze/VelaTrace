[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "velatrace"
version = "0.1.0a1"
description = "Connectivity-aware component audits and guarded external routing for KiCad"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["kicad-python==0.8.0", "PySide6-Essentials==6.10.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
tokenizer = ["transformers>=4.50,<6"]

[project.scripts]
velatrace = "velatrace.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
velatrace = ["router_resources/*.class", "router_resources/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Correctness checks without imposing unrelated repository-wide style churn.
select = ["E9", "F63", "F7", "F82"]
