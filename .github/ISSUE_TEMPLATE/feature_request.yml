name: Feature request
description: Suggest an audit rule, BOM check, routing improvement or UI change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the design mistake, cost or time sink, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like VelaTrace to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Audit rule, BOM savings, Routing, HTML report, UI, Docs, Other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
  - type: markdown
    attributes:
      value: |
        Project principles: free, offline-first, deterministic checks that stay quiet when unsure,
        no telemetry, and every board change previewed and undoable.
