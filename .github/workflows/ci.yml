name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Qt offscreen runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: python -m pip install -e '.[dev]'
      - name: Verify mandatory SDK and UI dependencies
        run: python -c "import kipy; from PySide6.QtWidgets import QApplication; app = QApplication([])"
      - name: Syntax and undefined-name checks
        run: python -m ruff check src tests launch.py
      - name: Offline services, SDK objects, and UI tests
        run: python -m pytest
