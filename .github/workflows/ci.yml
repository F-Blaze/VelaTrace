name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Verify mandatory SDK and UI dependencies
        run: python -c "import kipy; from PySide6.QtWidgets import QApplication; app = QApplication([])"
      - name: Syntax and undefined-name checks
        run: python -m ruff check src tests launch.py
      - name: Offline services, SDK objects, and UI tests
        run: python -m pytest
